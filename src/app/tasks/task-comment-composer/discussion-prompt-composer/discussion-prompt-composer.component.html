<h4>Step 1. Record and add up to 3 prompts.</h4>
<div
  fxLayout="row"
  fxLayoutAlign="space-around center"
  [hidden]="!canRecord || isSending"
>
  <div>
    <button
      aria-label="Record icon button"
      id="btnRecordPrompt"
      mat-icon-button
      [disabled]="!canAddRecording"
      (click)="recordingToggle()"
    >
      <mat-icon [hidden]="!isRecording">stop_rounded</mat-icon>
      <mat-icon [hidden]="isRecording">fiber_manual_record</mat-icon>
    </button>
  </div>

  <div class="audio-recorder">
    <p [hidden]="canRecord">
      Audio recording <br />
      only supported in modern versions of Chrome, Firefox and Safari.
    </p>
    <mat-spinner
      class="send-audio-spinner"
      [diameter]="72"
      [hidden]="!isSending"
      [strokeWidth]="2"
    ></mat-spinner>
    <div fxLayout="row" fxLayoutAlign="center center">
      <canvas
        #discussionPromptComposerCanvas
        class="discussion-prompt-audio-visualiser"
      ></canvas>
    </div>
    <audio #discussionPromptComposerAudio></audio>
  </div>

  <div>
    <button
      class="btn-circle"
      id="btnSave"
      mat-icon-button
      type="button"
      [disabled]="!recordingAvailable || !canAddRecording"
      (click)="saveRecording()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

<h4>Step 2. Optionally play back prompts.</h4>
<mat-action-list id="recordingList">
  <h3 mat-subheader>Discussion Prompts</h3>
  @for (recording of recordings; track recording; let i = $index) {
    <button mat-list-item (click)="playRecording(getUrl(recording))">
      <mat-icon mat-list-icon>play_arrow_rounded</mat-icon>
      <h4 mat-line>Prompt {{ i + 1 }}</h4>
      <p mat-line>Click to play recording</p>
    </button>
  }
</mat-action-list>

<h4>Step 3. Send.</h4>
<div fxLayout="row" fxLayoutAlign="end center">
  <button
    color="primary"
    mat-dialog-close
    mat-raised-button
    type="button"
    [hidden]="recordings.length === 0"
    (click)="sendRecording()"
  >
    Send
  </button>
</div>

<mat-divider style="margin: 3em 0 3em 0"></mat-divider>
