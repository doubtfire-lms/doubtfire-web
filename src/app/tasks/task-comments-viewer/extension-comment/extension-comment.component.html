<div fxLayout="row" fxLayoutAlign="space-evenly center">
  @if (comment.assessed) {
    <div fxLayout="column" fxLayoutAlign="space-around center">
      <hr class="hr-text" [attr.data-content]="message" />
      <p class="fade-text"><strong> reason:</strong> {{ comment.text }}</p>
    </div>
  }

  @if (!comment.assessed) {
    <div fxLayout="column" fxLayoutAlign="space-around center">
      <hr class="hr-fade" />
      <p>
        {{ message }} <br />
        <strong> reason:</strong> {{ comment.text }}
      </p>
      @if (isNotStudent) {
        <div fxLayout="row" fxLayoutAlign="space-evenly center">
          <button
            color="primary"
            mat-flat-button
            style="background-color: #43a047"
            (click)="grantExtension()"
          >
            Grant
          </button>
          <button color="warn" mat-flat-button (click)="denyExtension()">Deny</button>
        </div>
      }
      <hr class="hr-fade" />
    </div>
  }
</div>
