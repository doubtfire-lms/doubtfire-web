<div class="audio-recorder">
  <p [hidden]="canRecord">
    Audio recording <br />
    only supported in modern versions of Chrome, Firefox and Safari.
  </p>
  <mat-spinner
    class="send-audio-spinner"
    [diameter]="72"
    [hidden]="!isSending"
    [strokeWidth]="2"
  ></mat-spinner>
  <div id="mainDIscussionVisualiser" [hidden]="!canRecord || isSending">
    <canvas class="audio-visualiser" id="mainDiscussionRecorderVisualiser"></canvas>
  </div>
</div>
