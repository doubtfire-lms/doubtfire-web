<div class="flex flex-row items-center justify-evenly">
  @if (comment.assessed) {
    <div class="flex flex-col items-center justify-around">
      <hr
        class="hr-text"
        [attr.data-content]="
          comment.submissionGranted ? 'Submission access granted' : 'Submission access denied'
        "
      />
      <p class="fade-text"><strong> reason:</strong> {{ comment.text }}</p>
    </div>
  }

  @if (!comment.assessed) {
    <div class="flex flex-col items-center justify-around">
      <p class="fade-text">
        {{ isStudent ? 'You have' : comment.author.name + ' has' }} requested access to submit.
        <br />
        <strong> reason:</strong> {{ comment.text }}
      </p>
      @if (isNotStudent) {
        <div class="flex flex-row items-center justify-evenly">
          <button
            color="primary"
            mat-flat-button
            style="background-color: #43a047"
            (click)="grantSubmissionRequest()"
          >
            Grant
          </button>
          <button color="warn" mat-flat-button (click)="denySubmissionRequest()">Deny</button>
        </div>
      }
    </div>
  }
</div>
