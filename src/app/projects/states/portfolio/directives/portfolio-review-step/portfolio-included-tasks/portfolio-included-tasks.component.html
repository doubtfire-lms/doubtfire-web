@if (loading) {
  <div class="w-full flex flex-col gap-3 justify-center items-center min-h-[150px]">
    <div>Loading tasks...</div>
    <mat-progress-spinner mode="indeterminate"> </mat-progress-spinner>
  </div>
} @else {
  @if (tasksInPortfolio.length === 0) {
    <div class="w-full p-2.5 flex flex-col justify-center items-center h-full text-gray-400">
      <mat-icon class="scale-125">assignment_late</mat-icon>
      <p class="p-2.5">No tasks found</p>
    </div>
  } @else {
    <ol>
      @for (task of tasksInPortfolio; track task) {
        <li class="my-1">
          <div class="flex justify-between">
            <div class="flex gap-1 items-center">
              <div>{{ task.definition.abbreviation }} &mdash; {{ task.definition.name }}</div>
            </div>
            <status-icon [status]="task.status"></status-icon>
          </div>
        </li>
      }
    </ol>
  }
}
