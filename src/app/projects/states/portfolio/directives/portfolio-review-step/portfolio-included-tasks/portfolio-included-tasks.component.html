@if (loading) {
  <div class="flex min-h-[150px] w-full flex-col items-center justify-center gap-3">
    <div>Loading tasks...</div>
    <mat-progress-spinner mode="indeterminate"> </mat-progress-spinner>
  </div>
} @else {
  @if (tasksInPortfolio.length === 0) {
    <div class="flex size-full flex-col items-center justify-center p-2.5 text-gray-400">
      <mat-icon class="scale-125">assignment_late</mat-icon>
      <p class="p-2.5">No tasks found</p>
    </div>
  } @else {
    <ol>
      @for (task of tasksInPortfolio; track task) {
        <li class="my-1">
          <div class="flex justify-between">
            <div class="flex items-center gap-1">
              <div>{{ task.definition.abbreviation }} &mdash; {{ task.definition.name }}</div>
            </div>
            <status-icon [status]="task.status"></status-icon>
          </div>
        </li>
      }
    </ol>
  }
}
