<div class="p-4 h-[calc(100%-50px)]">
  <div class="flex items-center">
    <mat-icon class="mr-2">comment</mat-icon>
    <h1 class="mat-headline m-0">Staff Notes</h1>
    <span class="grow"></span>
    <div class="example-action-buttons">
      <button mat-button>Collapse All</button>
    </div>
  </div>

  <div class="flex flex-col h-full">
    <div #staffNotesContainer class="flex-1 overflow-auto p-4">
      @if (!loadingStaffNotes) {
        @for (note of project?.staffNoteCache?.currentValues; track note) {
          <mat-card class="mb-4 p-4">
            <div class="flex justify-between">
              <mat-card-title class="flex items-center">
                <user-icon size="25" [user]="note.user" style="margin-right: 8px"></user-icon>
                {{ note.user?.firstName }} {{ note.user?.lastName }}</mat-card-title
              >
              <div class="flex">
                <mat-card-subtitle
                  [matTooltip]="note.createdAt"
                  matTooltipPosition="above"
                  matTooltipShowDelay="1000"
                  >{{ note.createdAt | humanizedDate }}</mat-card-subtitle
                >
                <!-- TODO: only show delete if we're allowed to -->
                <button mat-button (click)="deleteNote(note)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </div>

            <mat-card-content class="py-4">
              <p class="">{{ note.note }}</p>
            </mat-card-content>
          </mat-card>
        }
      } @else {
        <!-- <div id="spinner">
          <mat-spinner
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50"
          ></mat-spinner>
        </div> -->
      }
    </div>

    <div class="h-[150px] border-t border-gray-300 p-4 flex">
      <mat-form-field appearance="outline" class="flex items-center w-full">
        <mat-label>Staff Note</mat-label>
        <textarea
          matInput
          [(ngModel)]="noteText"
          class="resize-none w-full px-2 py-1 placeholder:px-2 placeholder:py-1"
        ></textarea>
        <div class="flex justify-end">
          <button mat-raised-button color="primary" (click)="submitNote()">Submit</button>
        </div>
      </mat-form-field>
    </div>
  </div>
</div>
