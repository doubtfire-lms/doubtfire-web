<div class="flex flex-col w-full p-5 gap-5">
  @for (prompt of discussionPrompts; track prompt) {
    <mat-card appearance="outlined">
      <mat-card-content class="flex gap-5 items-center justify-evenly">
        <div
          class="rounded-full p-5 flex justify-center items-center bg-gray-200 max-h-8 w-32"
          [matTooltip]="prompt.taskDefinition.name"
          matTooltipPosition="above"
        >
          {{ prompt.taskDefinition.abbreviation }}
        </div>
        <div class="w-full">
          {{ prompt.content }}
        </div>
        <div class="w-32 text-center">
          {{ prompt.priorityLabel }}
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
