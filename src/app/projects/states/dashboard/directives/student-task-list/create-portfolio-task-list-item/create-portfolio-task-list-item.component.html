<a
  class="flex justify-between items-center w-fill text-inherit no-underline mr-3"
  [routerLink]="['/projects', project.id, 'portfolio']"
>
  <div class="flex items-center gap-5 flex-1 min-w-0">
    <div class="flex items-center gap-5 min-w-0 truncate text-ellipsis">
      <div class="flex flex-col justify-start truncate text-ellipsis">
        <div class="truncate text-ellipsis">Create Portfolio</div>

        <div class="flex items-center gap-1">
          <mat-icon class="text-gray-600 scale-75">person</mat-icon>
          <div class="task-details text-[14px] text-gray-500">Create and submit your portfolio</div>
        </div>
      </div>
    </div>
  </div>

  <status-icon [status]="status()"></status-icon>
</a>
