<a
  class="w-fill mr-2 flex items-center justify-between text-inherit no-underline"
  [routerLink]="['/projects', project.id, 'portfolio']"
>
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <div class="flex min-w-0 items-center gap-3 truncate text-ellipsis">
      <div class="flex flex-col justify-start truncate text-ellipsis">
        <div class="truncate text-ellipsis">Create Portfolio</div>

        <div class="flex items-center gap-0.5">
          <mat-icon class="scale-75 text-gray-600">person</mat-icon>
          <div class="task-details text-[14px] text-gray-500">
            Create and submit your portfolio
          </div>
        </div>
      </div>
    </div>
  </div>

  <status-icon [status]="status()"></status-icon>
</a>
