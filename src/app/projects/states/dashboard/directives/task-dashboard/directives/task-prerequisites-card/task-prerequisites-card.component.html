<mat-card appearance="outlined" class="p-[16px]">
  <div class="flex justify-between items-center w-full">
    <mat-card-title class="f-card-title">Prerequisite Tasks</mat-card-title>
    <mat-icon>pending_actions</mat-icon>
  </div>

  <mat-card-subtitle class="mb-4">
    You must submit these tasks before you can submit
    {{ taskDefinition.abbreviation }}.</mat-card-subtitle
  >
  <f-task-definition-prerequisites
    [taskDefinition]="taskDefinition"
    [editingMode]="false"
    [task]="task"
  ></f-task-definition-prerequisites>
</mat-card>
