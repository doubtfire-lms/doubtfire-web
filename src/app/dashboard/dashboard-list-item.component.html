<div class="task-item" [class.task-item--expanded]="expanded">
  <div class="task-color" [ngClass]="'task-color--' + color"></div>
  <div class="task-content">
    <div class="task-header" (click)="expanded = !expanded">
      <h4>{{ title }}</h4>
      <span *ngIf="comments > 0" class="task-alert task-alert--comment">{{ comments }}</span>
    </div>
    <div class="task-details">
      <span>{{ subtitle }}</span>
      <span *ngIf="abbreviation" class="task-badge task-badge--gray">{{ abbreviation }}</span>
    </div>
    <div class="task-expanded-body" *ngIf="expanded">
      <p class="task-working-on">Working On It</p>
      <p class="task-due">Submit by <strong>{{ subtitle }}</strong></p>
      <div class="task-btns">
        <button class="task-btn">📄 Task Sheet</button>
        <button class="task-btn">⬇ Resources</button>
        <button class="task-btn">→ More info</button>
      </div>
    </div>
  </div>
  <div class="task-arrow" [class.task-arrow--up]="expanded">&#8964;</div>
</div>
