<form [formGroup]="grantExtensionForm" (ngSubmit)="submitForm()">
  <!-- Student Selection with Search -->
  <div class="mb-4 w-full">
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Search Students</mat-label>
      <input
        matInput
        placeholder="Type to search students..."
        [ngModelOptions]="{standalone: true}"
        [(ngModel)]="searchQuery"
        (ngModelChange)="filterStudents()"
      />
    </mat-form-field>

    <!-- Select All Option -->
    <div *ngIf="showStudentList" class="mt-0 flex items-center px-2">
      <mat-checkbox
        #selectAllBox
        color="primary"
        disableRipple
        [checked]="selectedStudents?.length === filteredStudents?.length"
        (change)="toggleSelectAll()"
        (mouseup)="handleCheckboxBlur()"
      >
        Select All
      </mat-checkbox>
    </div>

    <!-- Student List -->
    <div
      *ngIf="showStudentList"
      class="student-list-container mt-4"
      style="
        max-height: 200px;
        min-height: 100px;
        overflow-y: auto;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 8px;
        scrollbar-width: thin;
        scrollbar-color: #888 #f1f1f1;
      "
      [class.border-2]="
        grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid
      "
      [class.border-red-500]="
        grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid
      "
    >
      <div
        *ngFor="let student of filteredStudents"
        class="flex cursor-pointer items-center px-4 py-2 transition-colors duration-200"
        role="option"
        tabindex="0"
        [attr.aria-selected]="isStudentSelected(student.id)"
        [class.bg-blue-100]="isStudentSelected(student.id)"
        [class.hover:bg-gray-100]="!isStudentSelected(student.id)"
        (click)="toggleStudent(student.id)"
        (keydown)="handleStudentKeydown($event, student.id)"
      >
        {{ student.name }} ({{ student.id }})
      </div>
    </div>
  </div>

  <!-- Student Selection Error -->
  <div
    *ngIf="
      grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid
    "
    style="color: #f44336; font-size: 12px; margin-top: 4px; margin-bottom: 24px"
  >
    Please select at least one student.
  </div>

  <!-- Extension Duration -->
  <div class="mb-8">
    <label class="mb-4 block text-xl font-semibold text-gray-900" for="extension">
      Extension Duration: <strong>{{ grantExtensionForm.get('extension')?.value }}</strong> week(s)
    </label>

    <div
      [class.border]="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
      [class.border-2]="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
      [class.border-red-500]="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
      [class.p-2]="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
      [class.rounded]="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
    >
      <mat-slider
        class="w-full"
        max="4"
        min="1"
        step="1"
        style="width: 100%; max-width: 600px; min-width: 300px"
        thumbLabel
        tickInterval="5"
      >
        <input formControlName="extension" matSliderThumb />
      </mat-slider>
    </div>

    <mat-error
      *ngIf="
        grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid
      "
      class="mt-2"
    >
      Please select a valid extension duration (1-4 weeks).
    </mat-error>
  </div>

  <!-- Reason Field -->
  <mat-form-field appearance="fill" class="mb-4 w-full">
    <mat-label>Reason</mat-label>
    <textarea
      formControlName="reason"
      matInput
      maxlength="300"
      placeholder="Explain why extension is needed (max 300 characters)"
      required
      rows="4"
    ></textarea>
    <mat-hint align="end">{{ grantExtensionForm.get('reason')?.value?.length || 0 }}/300</mat-hint>
    <mat-error
      *ngIf="grantExtensionForm.get('reason')?.touched && grantExtensionForm.get('reason')?.invalid"
    >
      Please provide a reason for the extension (max 300 characters).
    </mat-error>
  </mat-form-field>

  <!-- Form Buttons -->
  <div class="mt-6 flex justify-end gap-3">
    <button mat-button type="button" [disabled]="isSubmitting" (click)="resetForm()">Reset</button>
    <button color="primary" mat-flat-button type="submit" [disabled]="isSubmitting">
      Grant Extension
    </button>
  </div>
</form>
