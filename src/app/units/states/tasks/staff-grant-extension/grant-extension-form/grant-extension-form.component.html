<form [formGroup]="grantExtensionForm" (ngSubmit)="submitForm()">
  <!-- Student Selection with Search -->
  <div class="w-full mb-4">
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Search Students</mat-label>
      <input matInput
             [(ngModel)]="searchQuery"
             (ngModelChange)="filterStudents()"
             [ngModelOptions]="{standalone: true}"
             placeholder="Type to search students...">
    </mat-form-field>

    <!-- Select All Option -->
    <div class="flex items-center px-2 mt-0" *ngIf="showStudentList">
      <mat-checkbox
        #selectAllBox
        [checked]="selectedStudents.length === filteredStudents.length"
        (change)="toggleSelectAll()"
        (mouseup)="handleCheckboxBlur()"
        color="primary"
        disableRipple>
        Select All
      </mat-checkbox>
    </div>

    <!-- Student List -->
    <div *ngIf="showStudentList"
         class="student-list-container mt-4"
         [class.border-red-500]="grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid"
         [class.border-2]="grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid"
         style="max-height: 200px; min-height: 100px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; scrollbar-width: thin; scrollbar-color: #888 #f1f1f1;">
      <div *ngFor="let student of filteredStudents"
           class="flex items-center px-4 py-2 cursor-pointer transition-colors duration-200"
           [class.hover:bg-gray-100]="!isStudentSelected(student.id)"
           [class.bg-blue-100]="isStudentSelected(student.id)"
           (click)="toggleStudent(student.id)"
           (keydown)="handleStudentKeydown($event, student.id)"
           tabindex="0"
           role="option"
           [attr.aria-selected]="isStudentSelected(student.id)">
        {{ student.name }} ({{ student.id }})
      </div>
    </div>
  </div>

  <!-- Student Selection Error -->
  <div *ngIf="grantExtensionForm.get('students')?.touched && grantExtensionForm.get('students')?.invalid" style="color: #f44336; font-size: 12px; margin-top: 4px; margin-bottom: 24px;">
    Please select at least one student.
  </div>

  <!-- Extension Duration -->
  <div class="mb-8">
    <label for="extension" class="block text-xl font-semibold text-gray-900 mb-4">
      Extension Duration: <strong>{{ grantExtensionForm.get('extension')?.value }}</strong> day(s)
    </label>

    <div [class.border-red-500]="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid"
         [class.border-2]="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid"
         [class.border]="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid"
         [class.rounded]="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid"
         [class.p-2]="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid">
      <mat-slider
        min="1"
        max="30"
        step="1"
        tickInterval="5"
        thumbLabel
        class="w-full"
        style="width: 100%; max-width: 600px; min-width: 300px;"
      >
        <input matSliderThumb formControlName="extension" />
      </mat-slider>
    </div>

    <mat-error *ngIf="grantExtensionForm.get('extension')?.touched && grantExtensionForm.get('extension')?.invalid" class="mt-2">
      Please select a valid extension duration (1-30 days).
    </mat-error>
  </div>

  <!-- Reason Field -->
  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Reason</mat-label>
    <textarea
      matInput
      formControlName="reason"
      rows="4"
      required
    ></textarea>
    <mat-error *ngIf="grantExtensionForm.get('reason')?.touched && grantExtensionForm.get('reason')?.invalid">
      Please provide a reason for the extension.
    </mat-error>
  </mat-form-field>

  <!-- Notes Field (Optional) -->
  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Additional Notes (optional)</mat-label>
    <textarea matInput formControlName="notes" rows="3"></textarea>
  </mat-form-field>

  <!-- Form Buttons -->
  <div class="flex justify-end gap-3 mt-6">
    <button mat-button type="button" (click)="resetForm()" [disabled]="isSubmitting">Reset</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
      Grant Extension
    </button>
  </div>
</form>
