@if (!isMobileView) {
<div fxLayout="column" fxFill fxHide fxShow.gt-sm class="min-h-0">
  <div fxLayout="row" fxLayoutAlign="center stretch" fxFlex class="min-h-0">
    <div id="inboxpanel" #inboxpanel class="staff-task-list inbox-panel">
      @if (taskData) {
        <df-staff-task-list
          [isNarrow]="narrowTaskInbox"
          [showSearchOptions]="showSearchOptions"
          [filters]="filters"
          [taskData]="taskData"
          [unit]="unit"
          [unitRole]="unitRole"
          [viewType]="viewType"
        ></df-staff-task-list>
      }
    </div>
    @if (subs$ | async) {
      <div
        id="leftResizerEl"
        #leftResizerEl
        class="resizer"
        cdkDragLockAxis="x"
        cdkDrag
        (cdkDragMoved)="dragging($event, inboxpanel)"
        (cdkDragEnded)="stoppedDragging($event, inboxpanel)"
        (cdkDragStarted)="startedDragging($event, inboxpanel)"
      ></div>
    }

    <div fxFlex class="inbox-panel">
      <f-inbox-dashboard
        [task]="taskData?.selectedTask"
        (visiblePdfUrlChange)="visiblePdfUrl = $event"
      ></f-inbox-dashboard>
    </div>
    <div
      id="rightResizerEl"
      #rightResizerEl
      class="resizer"
      cdkDragLockAxis="x"
      cdkDrag
      (cdkDragMoved)="dragging($event, commentspanel)"
      (cdkDragEnded)="stoppedDragging($event, commentspanel)"
      (cdkDragStarted)="startedDragging($event, commentspanel)"
    ></div>
    <div #commentspanel class="task-comment-panel inbox-panel">
      <task-comments-viewer [task]="taskData.selectedTask"> </task-comments-viewer>
    </div>
  </div>
  <f-footer class="z-10 shrink-0" [viewType]="viewType"></f-footer>
</div>
} @else {
<div #mobile fxLayout="row" fxFill fxHide fxShow.lt-md>
  <div id="inboxpanel" #inboxpanel class="inbox-panel mobile" [hidden]="taskSelected">
    @if (taskData) {
      <df-staff-task-list
        [isNarrow]="false"
        [showSearchOptions]="showSearchOptions"
        [filters]="filters"
        [taskData]="taskData"
        [unit]="unit"
        [unitRole]="unitRole"
        [viewType]="viewType"
      ></df-staff-task-list>
    }
  </div>
  <div [hidden]="!taskSelected" fxLayout="column" fxFill fxLayoutAlign="space-between stretch">
    <div class="flex items-center">
      <button
        mat-icon-button
        aria-label="Back to inbox"
        matTooltip="Back to inbox"
        (click)="taskSelected = false"
      >
        <mat-icon>arrow_back_ios_new</mat-icon>
      </button>
      <h3 class="mb-0">{{ taskData?.selectedTask?.project.student.nickname }}</h3>
      <div fxFlex></div>
      <button
        [disabled]="!visiblePdfUrl"
        mat-icon-button
        aria-label="Open current document"
        (click)="openPdfInNewTab()"
        matTooltip="Open current document"
      >
        <mat-icon>description</mat-icon>
      </button>
      <button
        mat-icon-button
        aria-label="Go to student"
        matTooltip="Go to student"
        (click)="goToStudent()"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>

    <div fxFlex class="inbox-panel mobile">
      <f-inbox-dashboard
        [task]="taskData?.selectedTask"
        (visiblePdfUrlChange)="visiblePdfUrl = $event"
      ></f-inbox-dashboard>
    </div>
  </div>
</div>
}
