<h3 mat-dialog-title>
  <div class="flex flex-row items-center">
    <i class="fa fa-question-circle fa-2x pull-left"></i>
    <div class="flex flex-col">
      <div>{{ title }}</div>
      <small>Please confirm that you want to perform this action.</small>
    </div>
  </div>
</h3>
<mat-dialog-content>
  <p>
    {{ description }}
  </p>
  @if (showDismissAll) {
    <p>
      <mat-checkbox [(ngModel)]="dismissAllTasks">
        Apply this action to all {{ task.definition.abbreviation }} {{ task.definition.name }} tasks
        from {{ task.tutor?.user.name ?? 'N/A' }}, currently waiting for moderation
      </mat-checkbox>
    </p>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button color="primary" (click)="runCallback()">
    <i class="fa fa-check"></i> Confirm
  </button>
  <button mat-button color="warn" (click)="dismiss()">Cancel</button>
</mat-dialog-actions>
