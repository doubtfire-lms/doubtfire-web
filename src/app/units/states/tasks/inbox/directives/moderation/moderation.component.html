<!-- <div class="flex justify-center py-2">Tutor: {{ task.tutor?.user.name }}</div> -->
<span class="center-buttons flex justify-around gap-2">
  <button
    [disabled]="task === undefined || isModerated(task)"
    mat-icon-button
    matTooltip="Show more from this tutor"
    matTooltipPosition="above"
    aria-label=""
    class="button"
    (click)="showMore()"
  >
    <mat-icon>flag</mat-icon>
  </button>
  <button
    [disabled]="task === undefined || isModerated(task)"
    mat-icon-button
    matTooltip="Dismiss moderation task"
    matTooltipPosition="above"
    aria-label=""
    class="button large-button"
    (click)="dismiss()"
  >
    <mat-icon>archive</mat-icon>
  </button>
  <button
    [disabled]="task === undefined || isModerated(task)"
    mat-icon-button
    matTooltip="Show less from this tutor"
    matTooltipPosition="above"
    aria-label=""
    class="button"
    (click)="showLess()"
  >
    <mat-icon>thumb_up</mat-icon>
  </button>
</span>
