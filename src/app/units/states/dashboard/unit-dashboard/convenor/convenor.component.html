@if (workload$ | async; as workload) {
  <div class="mx-auto my-7 flex max-w-70 flex-wrap justify-center gap-5 sm:max-w-none">
    @for (card of cards; track card.key) {
      <div
        class="box-border flex min-h-32 w-full flex-col items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white p-5 text-slate-800 sm:w-70"
      >
        <mat-icon aria-hidden="true" class="text-formatif-blue">{{ card.icon }}</mat-icon>
        <h2 class="m-0 text-lg font-medium">{{ card.title }}</h2>
        @let count = workload.counts[card.key];
        @if (count === null || count === 'Unavailable') {
          <span class="flex min-h-11 items-center text-sm">{{ count ?? 'Loading…' }}</span>
        } @else {
          <span class="min-h-11 text-[44px] leading-none font-medium tabular-nums">{{
            count
          }}</span>
        }
      </div>
    }
  </div>
  <f-open-inbox-button />
  <f-ta-workload-overview [unit]="workload.unit" />
  <f-task-turnaround [unit]="workload.unit" />
}
