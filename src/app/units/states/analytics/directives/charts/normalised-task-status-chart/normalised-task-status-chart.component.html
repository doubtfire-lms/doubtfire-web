<ng-charts-bar-vertical-normalized
  class="reverse-legend-order"
  [animations]="false"
  [gradient]="false"
  [legend]="true"
  [results]="data"
  [scheme]="$any(colorScheme)"
  [showXAxisLabel]="true"
  [showYAxisLabel]="true"
  [tooltipDisabled]="false"
  [xAxis]="true"
  [yAxis]="true"
  [yAxisLabel]="YLabel"
>
</ng-charts-bar-vertical-normalized>
