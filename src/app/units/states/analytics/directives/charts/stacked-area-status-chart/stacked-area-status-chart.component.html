<ng-charts-area-chart-stacked
  class="reverse-legend-order"
  [animations]="false"
  [gradient]="false"
  [legend]="true"
  [results]="data"
  [scheme]="$any(colorScheme)"
  [showXAxisLabel]="true"
  [showYAxisLabel]="true"
  [tooltipDisabled]="false"
  [xAxis]="true"
  [yAxis]="true"
  [yAxisLabel]="YAxisLabel"
>
</ng-charts-area-chart-stacked>
