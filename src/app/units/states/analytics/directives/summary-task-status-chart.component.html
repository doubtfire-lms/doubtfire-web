<mat-card appearance="outlined" class="p-4">
  <mat-card-title>
    <h2>Task Completion Status</h2>
  </mat-card-title>
  <div class="flex items-center gap-2 p-4">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-select [(ngModel)]="campusFilter" (selectionChange)="refreshData()">
        <mat-option value="all">All</mat-option>
        @for (campus of campuses; track campus) {
          <mat-option [value]="campus">{{ campus }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button
      aria-label="Capture completion snapshot now"
      class="self-center"
      mat-icon-button
      (click)="captureNow()"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
  <div class="h-125">
    <ngx-charts-bar-vertical-normalized
      class="reverse-legend-order"
      [animations]="animations"
      [gradient]="gradient"
      [legend]="showLegend"
      [results]="data"
      [scheme]="$any(colorScheme)"
      [showXAxisLabel]="showXAxisLabel"
      [showYAxisLabel]="showYAxisLabel"
      [tooltipDisabled]="false"
      [xAxis]="showXAxis"
      [xAxisLabel]="xAxisLabel"
      [yAxis]="showYAxis"
      [yAxisLabel]="yAxisLabel"
    >
    </ngx-charts-bar-vertical-normalized>
  </div>
  <div class="flex items-center gap-3 px-4 pt-0 pb-4">
    <div class="min-w-24 text-sm text-slate-600">{{ firstSnapshotDate }}</div>
    <mat-slider
      class="snapshot-slider w-full"
      [disabled]="snapshots.length <= 1"
      [discrete]="true"
      [displayWith]="formatSnapshotDate"
      [max]="sliderMax"
      [min]="0"
      [showTickMarks]="true"
      [step]="1"
    >
      <input
        matSliderThumb
        [ngModel]="sliderSelect"
        (ngModelChange)="onSnapshotSliderChange($event)"
      />
    </mat-slider>
    <div class="min-w-24 text-right text-sm text-slate-600">
      {{ lastSnapshotDate }}
    </div>
  </div>
</mat-card>
