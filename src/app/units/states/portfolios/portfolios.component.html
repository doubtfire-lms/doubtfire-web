<div class="container">
  <h1>Student Portfolios</h1>
  <!-- TODO: loading unit spinner -->
  @if (unit) {
    <mat-tab-group #tabs>
      <mat-tab label="Select Student">
        <f-portfolios-list
          class="p-5"
          [unit]="unit"
          (studentSelected)="studentSelected($event)"
        ></f-portfolios-list>
      </mat-tab>
      <mat-tab label="View Progress" [disabled]="!selectedProject">
        @if (selectedProject) {
          <f-portfolios-project-progress
            class="p-5"
            [unit]="unit"
            [project]="selectedProject"
          ></f-portfolios-project-progress>
        }
      </mat-tab>
      <!-- TODO: View Staff Notes directive -->
      <mat-tab label="View Portfolio" [disabled]="!selectedProject">
        @if (selectedProject) {
          <f-portfolios-portfolio-view
            class="p-5"
            [project]="selectedProject"
          ></f-portfolios-portfolio-view>
        }
      </mat-tab>
      <mat-tab label="Assess Portfolio" [disabled]="!selectedProject">
        @if (selectedProject) {
          <f-portfolios-assessment
            class="p-5"
            [project]="selectedProject"
          ></f-portfolios-assessment>
        }
      </mat-tab>
    </mat-tab-group>
  }
</div>
