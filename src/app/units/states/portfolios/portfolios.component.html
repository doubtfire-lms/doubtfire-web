<div class="container">
  <h1>Student Portfolios</h1>
  <!-- TODO: loading unit spinner -->
  @if (unit) {
    <mat-tab-group>
      <mat-tab label="Select Student">
        <f-portfolios-list class="p-5" [unit]="unit"></f-portfolios-list>
      </mat-tab>
      <mat-tab label="View Progress" [disabled]="!selectedProject">
        <f-portfolios-project-progress class="p-5"></f-portfolios-project-progress>
      </mat-tab>
      <!-- TODO: View Staff Notes directive -->
      <mat-tab label="View Portfolio" [disabled]="!selectedProject">
        <f-portfolios-portfolio-view class="p-5"></f-portfolios-portfolio-view>
      </mat-tab>
      <mat-tab label="Assess Portfolio" [disabled]="!selectedProject">
        <f-portfolios-assessment class="p-5"></f-portfolios-assessment>
      </mat-tab>
    </mat-tab-group>
  }
</div>
