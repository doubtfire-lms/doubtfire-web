<div class="p-3">
  <div class="flex items-center justify-between gap-3">
    <h2>Review portfolio of {{ project.student.name }}</h2>
    @if (project.portfolioAvailable && hasAdditionalFiles) {
      <button color="primary" mat-stroked-button (click)="downloadAdditionalFiles()">
        <mat-icon>folder_zip</mat-icon>
        Download additional files
      </button>
    }
  </div>
  <p>View or download portfolio for assessment.</p>

  @if (project.portfolioAvailable) {
    <f-pdf-viewer class="flex h-screen w-full grow" [pdfUrl]="project.portfolioUrl()">
    </f-pdf-viewer>
  } @else {
    <div class="mt-12 flex w-full flex-col items-center justify-center gap-3 p-6">
      <mat-icon>menu_book</mat-icon>
      <h3 class="text-2xl">No Portfolio Submitted</h3>
    </div>
  }
</div>
