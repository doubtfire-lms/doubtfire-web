<div class="p-5">
  <h2>Review portfolio of {{ project.student.name }}</h2>
  <p>View or download portfolio for assessment.</p>

  @if (project.portfolioAvailable) {
    <f-pdf-viewer class="w-full h-screen flex flex-grow" [pdfUrl]="project.portfolioUrl()">
    </f-pdf-viewer>
  } @else {
    <div class="w-full flex flex-col justify-center items-center p-10 gap-5 mt-20">
      <mat-icon>menu_book</mat-icon>
      <h3 class="text-4xl">No Portfolio Submitted</h3>
    </div>
  }
</div>
