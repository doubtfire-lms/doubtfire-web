<div class="container">
  <mat-card appearance="outlined" class="max-w-5xl mx-auto">
    <mat-card-header>
      <mat-card-title>Rollover Unit</mat-card-title>
    </mat-card-header>

    <mat-card-content class="py-5">
      <p>Duplicate an existing unit by specifying the time period</p>

      <mat-form-field appearance="outline">
        <mat-label>Teaching Period</mat-label>
        <mat-select [(ngModel)]="teachingPeriod">
          <mat-option [value]="-1">Custom Date</mat-option>
          @for (period of teachingPeriods; track period) {
            <mat-option [value]="period">{{ period.year }} {{ period.period }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <div class="flex gap-2">
        <mat-form-field appearance="outline">
          <mat-label>Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="startDatePicker"
            [(ngModel)]="newStartDate"
            name="newStartDate"
            required
          />
          <mat-hint>DD/MM/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>End Date</mat-label>
          <input
            matInput
            [matDatepicker]="endDatePicker"
            [(ngModel)]="newEndDate"
            name="newEndDate"
            required
          />
          <mat-hint>DD/MM/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>
</div>
