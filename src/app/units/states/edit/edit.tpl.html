<div style="width: 100%;">
  <tabset class="tabset-icon">
    <tab ng-repeat="tab in tabs | toArray | orderBy: 'seq'" active="tab.active" ng-click="setActiveTab(tab)">
      <tab-heading>{{tab.title}}</tab-heading>
    </tab>
  </tabset><!--/tabs-->
  <unit-details-editor [unit]="unit" ng-if="activeTab === tabs.unitTab"></unit-details-editor>
  <f-learning-outcome-editor [context]="unit" ng-if="activeTab === tabs.learningOutcomesTab"></f-learning-outcome-editor>
  <unit-staff-editor [unit]="unit" [staff]="staff" ng-if="activeTab === tabs.staffTab"></unit-staff-editor>
  <unit-tutorials-manager ng-if="activeTab === tabs.tutorialsTab" [unit]="unit"></unit-tutorials-manager>
  <unit-students-editor [unit]="unit" ng-if="activeTab === tabs.studentsTab"></unit-students-editor>
  <f-unit-task-editor ng-if="activeTab === tabs.tasksTab" [unit]="unit"></f-unit-task-editor>
  <f-unit-group-set-editor ng-if="activeTab === tabs.groupsTab" [unit]="unit" [unit-role]="assessingUnitRole"></f-unit-group-set-editor>
</div>
