<div>
  <div class="mb-2 flex flex-wrap items-center justify-end gap-3">
    <div class="flex items-center">
      <span>Streams CSV</span>
      <div class="flex items-center">
        <button
          aria-label="Download tutorial streams CSV"
          mat-icon-button
          (click)="unit.downloadTutorialStreamsCsv()"
        >
          <mat-icon>download</mat-icon>
        </button>
        <button
          aria-label="Upload tutorial streams CSV"
          mat-icon-button
          (click)="uploadTutorialStreamsCsv()"
        >
          <mat-icon>upload_file</mat-icon>
        </button>
      </div>
    </div>
    <div class="flex items-center">
      <span>Tutorials CSV</span>
      <div class="flex items-center">
        <button
          aria-label="Download tutorials CSV"
          mat-icon-button
          (click)="unit.downloadTutorialsCsv()"
        >
          <mat-icon>download</mat-icon>
        </button>
        <button aria-label="Upload tutorials CSV" mat-icon-button (click)="uploadTutorialsCsv()">
          <mat-icon>upload_file</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <!-- <df-unit-tutorials-list [unit]="unit"></df-unit-tutorials-list> -->
  @for (stream of unit.tutorialStreams; track stream) {
    <df-unit-tutorials-list [stream]="stream" [unit]="unit"></df-unit-tutorials-list>
  } @empty {
    <div class="no-tutorials container mx-auto">
      <div class="mx-auto flex max-w-4xl flex-col items-center justify-center">
        <mat-icon>groups</mat-icon>
        <h1>No Tutorials</h1>
        <p class="p-1 text-center text-gray-500">
          There are no tutorials yet. Create a tutorial stream to begin adding tutorials.
        </p>
      </div>
    </div>
  }
  <div class="mt-3 flex w-full justify-center">
    <button class="mx-auto" color="primary" mat-raised-button [matMenuTriggerFor]="activities">
      <mat-icon>add</mat-icon>
      New Tutorial Stream
    </button>
  </div>

  <mat-menu #activities="matMenu">
    @for (activityType of activityTypes; track activityType) {
      <button mat-menu-item (click)="onClickNewActivity(activityType)">
        <span>{{ activityType.name }}</span>
      </button>
    }
  </mat-menu>
</div>
