<div class="flex flex-row gap-2.5">
  <mat-form-field appearance="outline" class="basis-1/3">
    <mat-label>Grade where task appears</mat-label>
    <mat-select required [(ngModel)]="taskDefinition.targetGrade">
      @for (grade of grades; track grade.value) {
        <mat-option [value]="grade.value">{{ grade.viewValue }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="basis-1/3">
    <mat-label>Abbreviation - Week, sequence, and grade. eg 1.1P</mat-label>
    <input matInput required [(ngModel)]="taskDefinition.abbreviation" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="flex-grow">
    <mat-label>Weight - Effort relative to other tasks.</mat-label>
    <input matInput required type="number" [(ngModel)]="taskDefinition.weighting" />
  </mat-form-field>
</div>

<mat-form-field appearance="outline" class="flex flex-grow">
  <mat-label>Descriptive task name</mat-label>
  <input matInput required [(ngModel)]="taskDefinition.name" />
</mat-form-field>

<mat-form-field appearance="outline" class="flex flex-grow">
  <mat-label>Task description</mat-label>
  <textarea matInput required [(ngModel)]="taskDefinition.description"> </textarea>
</mat-form-field>
