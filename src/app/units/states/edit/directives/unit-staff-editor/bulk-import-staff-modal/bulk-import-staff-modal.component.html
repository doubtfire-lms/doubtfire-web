<h3 mat-dialog-title>Bulk Import Staff</h3>

<div mat-dialog-content>
  <p>Paste one staff email per line to add them to this unit as tutors.</p>

  <mat-form-field class="w-full" appearance="outline">
    <mat-label>Staff emails</mat-label>
    <textarea
      matInput
      rows="10"
      placeholder="tutor@example.edu.au&#10;convenor@example.edu.au"
      [(ngModel)]="emailList"
    ></textarea>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-stroked-button color="warn" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!emailList.trim()" (click)="submit()">
    Import staff
  </button>
</div>
