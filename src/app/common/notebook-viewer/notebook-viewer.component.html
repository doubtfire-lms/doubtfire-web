<div class="relative flex size-full min-h-[350px] flex-col bg-white">
  <!-- Floats over the notebook, so the tools take no height of their own. Faded until hovered -->
  <div class="pointer-events-none absolute inset-x-0 top-0 z-20 flex items-start p-2">
    <div
      class="pointer-events-auto mr-auto flex rounded-full bg-gray-200 opacity-50 shadow-sm transition-opacity duration-150 focus-within:opacity-100 hover:opacity-100"
    >
      <button aria-label="Switch notebook view" mat-icon-button (click)="toggleView()">
        @if (viewMode === 'raw') {
          <mat-icon>toggle_on</mat-icon>
        } @else {
          <mat-icon>toggle_off</mat-icon>
        }
      </button>
    </div>
    <div class="pointer-events-auto ml-auto" [hidden]="viewMode === 'raw'">
      @if (searchOpen) {
        <form
          class="search-bar flex w-80 justify-end overflow-hidden rounded-full bg-white shadow-md transition-[width,opacity] duration-200 ease-out starting:w-10 starting:opacity-0"
          (focusout)="onSearchFocusOut($event)"
          (keydown.escape)="closeSearch()"
          (ngSubmit)="findNextMatch()"
        >
          <mat-form-field
            appearance="outline"
            class="w-80 shrink-0"
            floatLabel="auto"
            subscriptSizing="dynamic"
          >
            <mat-icon matPrefix>search</mat-icon>
            <input
              #searchInput
              aria-label="Search notebook"
              matInput
              name="notebookSearchString"
              placeholder="Search notebook"
              type="search"
              [(ngModel)]="searchQuery"
              (ngModelChange)="scheduleSearch()"
            />
            <button
              aria-label="Zoom out notebook"
              mat-icon-button
              matSuffix
              type="button"
              (click)="zoomOut()"
            >
              <mat-icon>zoom_out</mat-icon>
            </button>
            <button
              aria-label="Zoom in notebook"
              mat-icon-button
              matSuffix
              type="button"
              (click)="zoomIn()"
            >
              <mat-icon>zoom_in</mat-icon>
            </button>
          </mat-form-field>
        </form>
      } @else {
        <button
          aria-label="Search and zoom"
          class="rounded-full bg-gray-200 opacity-50 shadow-sm transition-opacity duration-150 focus-within:opacity-100 hover:opacity-100"
          mat-icon-button
          (click)="openSearch()"
        >
          <mat-icon>search</mat-icon>
        </button>
      }
    </div>
  </div>

  @if (viewMode === 'raw') {
    <ngx-monaco-editor
      class="notebook-monaco block min-h-0 w-full flex-1"
      [ngModel]="notebookText"
      [options]="rawEditorOptions"
    ></ngx-monaco-editor>
  }

  <div class="relative min-h-0 flex-1 overflow-hidden bg-white" [class.hidden]="viewMode === 'raw'">
    <iframe
      #notebookFrame
      class="absolute top-0 left-0 origin-top-left border-0 bg-white"
      referrerpolicy="no-referrer"
      sandbox="allow-popups allow-popups-to-escape-sandbox"
      title="Jupyter notebook"
      [attr.aria-hidden]="isLoading || errorMessage || viewMode === 'raw' ? 'true' : null"
      [attr.tabindex]="isLoading || errorMessage || viewMode === 'raw' ? -1 : 0"
      [style.height.%]="100 / zoomValue"
      [style.pointerEvents]="isLoading || errorMessage || viewMode === 'raw' ? 'none' : 'auto'"
      [style.transform]="'scale(' + zoomValue + ')'"
      [style.width.%]="100 / zoomValue"
      (load)="onFrameLoad()"
    ></iframe>
    @if (isLoading) {
      <div class="absolute inset-0 z-10 flex items-center justify-center bg-white">
        <mat-spinner diameter="40" strokeWidth="3"></mat-spinner>
      </div>
    } @else if (errorMessage) {
      <div
        class="absolute inset-0 z-10 flex items-center justify-center bg-white px-4 text-slate-600"
      >
        {{ errorMessage }}
      </div>
    }
  </div>
</div>
