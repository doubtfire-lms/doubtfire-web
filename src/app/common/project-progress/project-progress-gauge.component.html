<ngx-charts-gauge
  angleSpan="359"
  bigSegments="1"
  legendPosition="right"
  smallSegments="0"
  startAngle="1"
  units="%"
  [legend]="legend"
  [max]="100"
  [min]="0"
  [results]="gaugeData"
  [showAxis]="false"
  [showText]="true"
  [textValue]="gaugeData[0].value"
  [tooltipDisabled]="true"
  [view]="view"
>
</ngx-charts-gauge>
