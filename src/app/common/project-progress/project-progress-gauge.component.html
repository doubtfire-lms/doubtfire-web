<ngx-charts-gauge
  units="%"
  [angleSpan]="359"
  [bigSegments]="1"
  [legend]="legend"
  [legendPosition]="rightLegendPosition"
  [max]="100"
  [min]="0"
  [results]="gaugeData"
  [showAxis]="false"
  [showText]="true"
  [smallSegments]="0"
  [startAngle]="1"
  [textValue]="gaugeData[0].value.toString()"
  [tooltipDisabled]="true"
  [view]="view"
>
</ngx-charts-gauge>
