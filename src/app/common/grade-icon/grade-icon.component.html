<div>
  <span
    class="m-0 flex size-[2.25em] items-center justify-center rounded-full bg-[#333] text-[1em] font-thin text-white"
    matTooltip="{{ gradeText }}"
    matTooltipPosition="above"
    [ngClass]="{
      colorful: colorful,
      'grade-0': grade === 0,
      'grade-1': grade === 1,
      'grade-2': grade === 2,
      'grade-3': grade === 3,
    }"
  >
    {{ gradeLetter }}
  </span>
</div>
