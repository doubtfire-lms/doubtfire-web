<input
  #fileUpload
  class="hidden"
  type="file"
  [accept]="accept"
  [multiple]="multiple"
  (change)="onFileSelected($event)"
/>

<div appDragDrop class="flex w-full items-center" (fileDropped)="onFileDragOver($event)">
  <button
    class="h-[52px] shrink-0 rounded-lg rounded-r-none border-r-0"
    color="primary"
    mat-flat-button
    [disabled]="uploadProgress"
    (click)="fileUpload.click()"
  >
    @if (uploadProgress) {
      <mat-spinner mode="indeterminate" [diameter]="18" [strokeWidth]="0.5"></mat-spinner>
    }
    @if (!uploadProgress) {
      <span>Choose file</span>
    }
  </button>
  <div class="f-inner-border flex grow items-center rounded-lg rounded-l-none bg-white">
    <div class="flex w-full flex-col">
      <div class="ml-2.5 flex h-[48px] items-center">
        @if (file?.name) {
          <mat-icon class="mr-1">upload_file</mat-icon>
        }
        <span class="mt-[4px] max-w-xs grow truncate"> {{ file?.name || message }} </span>
        {{ uploadProgress }}
        <button
          class="ml-auto"
          mat-icon-button
          [disabled]="!file?.name"
          (click)="uploadProgress ? cancelUpload() : upload()"
        >
          @if (!uploadProgress) {
            <mat-icon [ngClass]="{'animate-bounce': $safeNavigationMigration(file?.name)}"
              >upload</mat-icon
            >
          }
          @if (uploadProgress) {
            <mat-icon>cancel</mat-icon>
          }
        </button>
      </div>
      @if (uploadProgress) {
        <mat-progress-bar mode="determinate" [value]="uploadProgress"> </mat-progress-bar>
      }
      @if (!uploadProgress) {
        <span class="h-[4px]"></span>
      }
    </div>
  </div>
</div>
