<div
  [ngClass]="[statusClass, compact ? 'min-w-[30px] max-w-[30px]' : 'min-w-[50px] px-3']"
  matTooltip="{{ statusLabel }}"
  matTooltipPosition="above"
  [matTooltipDisabled]="!showTooltip"
  class="status-chip mx-0.5 flex h-7 min-h-[30px] cursor-pointer items-center justify-center rounded-full"
  style="font-size: 14px"
>
  <mat-icon
    class="m-0 scale-75 place-self-center"
    [ngClass]="{'font-black': resolvedStatus === 'complete'}"
    >{{ statusIcon }}</mat-icon
  >
</div>
