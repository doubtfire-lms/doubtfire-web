<div
  [ngClass]="statusClass(status)"
  matTooltip="{{ statusLabel(status) }}"
  matTooltipPosition="above"
  [matTooltipDisabled]="!showTooltip"
  class="status-chip rounded-full cursor-pointer px-3 min-h-[30px] h-7 mx-0.5 flex justify-center items-center"
  style="font-size: 14px; min-width: 50px"
>
  <mat-icon
    class="self-center justify-self-center m-0 scale-75"
    [ngClass]="{'font-black': status === 'complete'}"
    >{{ statusIcon(status) }}</mat-icon
  >
</div>
