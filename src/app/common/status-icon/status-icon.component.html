<div
  [ngClass]="statusClass(status)"
  matTooltip="{{ statusLabel(status) }}"
  matTooltipPosition="above"
  [matTooltipDisabled]="!showTooltip"
  class="status-chip rounded-full cursor-pointer pl-3.5 pr-3.5 min-h-[30px] h-7 ml-0.5 mr-0.5 flex justify-center items-center"
  style="font-size: 14px; min-width: 50px"
>
  <mat-icon class="self-center justify-self-center m-0">{{ statusIcon(status) }}</mat-icon>
</div>
