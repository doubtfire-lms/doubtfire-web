@if (hasError) {
  <div class="flex items-center gap-2 bg-white p-4 text-sm text-red-700">
    <mat-icon>error_outline</mat-icon>
    <span>Unable to show this PDF. Use the download button to open it.</span>
  </div>
} @else {
  <div class="relative" [style.height.px]="pagesHeight ?? 384">
    @if (isNearScreen) {
      <pdf-viewer
        class="block size-full [&_.ng2-pdf-viewer-container]:overflow-y-hidden"
        [external-link-target]="'blank'"
        [original-size]="false"
        [render-text]="true"
        [show-all]="true"
        [src]="pdfUrl"
        (after-load-complete)="onLoaded()"
        (error)="onError()"
        (pages-initialized)="onPagesInitialized()"
      ></pdf-viewer>
    }
    @if (!isLoaded) {
      <div class="absolute inset-0 flex items-center justify-center gap-2 text-sm text-slate-600">
        <mat-spinner diameter="20" strokeWidth="2"></mat-spinner>
        <span>Loading PDF...</span>
      </div>
    }
  </div>
}
