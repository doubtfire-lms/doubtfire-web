<div class="rounded-lg border border-gray-200 bg-white p-4">
  <p class="rounded-md bg-amber-50 p-3 text-sm text-amber-800" [hidden]="canRecord">
    Audio recording is only supported in modern versions of Chrome, Firefox and Safari.
  </p>

  <mat-spinner
    class="mx-auto my-4"
    [diameter]="72"
    [hidden]="!isSending"
    [strokeWidth]="2"
  ></mat-spinner>

  <div class="space-y-5" [hidden]="!canRecord || isSending">
    <div class="space-y-3">
      <div>
        <h3 class="m-0 text-base font-semibold text-gray-900">Record some audio</h3>
        <p class="m-0 text-sm text-gray-600">Use this quick check to confirm your microphone.</p>
      </div>

      <div class="flex items-center gap-3">
        <button
          aria-label="Record test audio"
          class="shrink-0 text-white shadow-sm transition"
          id="btnRecord"
          mat-icon-button
          type="button"
          [class.!bg-blue-600]="!isRecording"
          [class.!bg-red-600]="isRecording"
          (click)="recordingToggle()"
        >
          @if (isRecording) {
          <mat-icon>stop</mat-icon>
          } @else {
          <mat-icon>mic</mat-icon>
          }
        </button>

        <div
          class="relative min-w-[180px] grow overflow-hidden rounded-lg border border-blue-100 bg-blue-50"
        >
          <canvas #micTesterVisualiser class="h-[72px] w-full" id="micTesterVisualiser"></canvas>
          <div
            class="pointer-events-none absolute inset-0 bg-gradient-to-r from-white/50 via-transparent to-white/50"
          ></div>
        </div>
      </div>

      <audio #micTesterAudioPlayer id="micTesterAudioPlayer"></audio>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h3 class="m-0 text-base font-semibold text-gray-900">Play it back</h3>
        <p class="m-0 text-sm text-gray-600">
          Stop the recording, then listen to make sure it is clear.
        </p>
      </div>
      <button
        color="primary"
        id="btnPlay"
        mat-raised-button
        type="button"
        [disabled]="!recordingAvailable"
        (click)="playStop()"
      >
        Play test recording
      </button>
    </div>

    <div class="rounded-md bg-blue-50 p-3 text-sm text-blue-900">
      When everything sounds right, check “Ready to go” below.
    </div>
  </div>
</div>
