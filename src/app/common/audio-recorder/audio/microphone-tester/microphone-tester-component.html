<div class="audio-recorder">
  <p [hidden]="canRecord">
    Audio recording <br />
    only supported in modern versions of Chrome, Firefox and Safari.
  </p>
  <mat-spinner
    class="send-audio-spinner"
    [diameter]="72"
    [hidden]="!isSending"
    [strokeWidth]="2"
  ></mat-spinner>
  <div [hidden]="!canRecord || isSending">
    <div fxLayout="row" fxLayoutAlign="space-between start">
      <div fxLayout="column" fxLayoutAlign="start start">
        <h1>Step 1. Record some audio!</h1>
        <button
          class="btn-circle-xl"
          id="btnRecord"
          type="button"
          (click)="recordingToggle()"
        >
          <p [hidden]="isRecording">record</p>
          <mat-icon [hidden]="!isRecording">stop</mat-icon>
        </button>
        <audio id="micTesterAudioPlayer"></audio>
      </div>

      <div fxLayout="column" fxLayoutAlign="start start">
        <canvas class="audio-visualiser" id="micTesterVisualiser"></canvas>
      </div>
    </div>

    <div
      fxLayout="row"
      fxLayoutAlign="space-between start"
      style="margin-bottom: 48px"
    >
      <h1>
        Step 2. Stop the recording, and playback the audio to make sure it's
        audible:
      </h1>
      <button
        color="primary"
        id="btnPlay"
        mat-raised-button
        type="button"
        [disabled]="!recordingAvailable"
        (click)="playStop()"
      >
        Play test recording
      </button>
    </div>

    <div
      fxLayout="row"
      fxLayoutAlign="space-between start"
      style="margin-bottom: 24px"
    >
      <h1>Step 3. Check the "Ready to go" cehckbox below if you're all set!</h1>
    </div>
  </div>
</div>
