<div class="p-3.5">
  @if (taskComment.commentType === 'image') {
    <img
      class="w-full h-full p-0 rounded border-none"
      [src]="commentResourceUrl"
      alt="Image attachment"
    />
  } @else if (taskComment.commentType === 'pdf') {
    <f-pdf-viewer class="w-full h-[85vh] block" [pdfUrl]="commentResourceUrl"> </f-pdf-viewer>
  }
</div>
