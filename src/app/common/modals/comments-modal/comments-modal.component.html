<div class="p-3.5">
  @if (taskComment.commentType === 'image') {
    <img
      alt="Image attachment"
      class="size-full rounded border-none p-0"
      [src]="commentResourceUrl"
    />
  } @else if (taskComment.commentType === 'pdf') {
    <f-pdf-viewer class="block h-[85vh] w-full" [pdfUrl]="commentResourceUrl"> </f-pdf-viewer>
  }
</div>
