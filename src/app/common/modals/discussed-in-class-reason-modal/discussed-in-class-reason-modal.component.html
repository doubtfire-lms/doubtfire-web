<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="flex flex-col gap-2.5">
  <p>{{ data.prompt }}</p>

  <div>
    {{ data.prefix }}
  </div>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Reason</mat-label>
    <textarea
      matInput
      rows="5"
      maxlength="1000"
      [(ngModel)]="reasonBody"
      placeholder="Add the rest of the tutor note here."
    ></textarea>
    @if (reasonBody.length > 0 && !hasReasonBody) {
      <mat-error> Please enter at least {{ minimumReasonLength }} characters. </mat-error>
    }
    <div class="flex justify-end">
      <mat-hint>{{ trimmedReasonBody.length }}/1000</mat-hint>
    </div>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="!hasReasonBody">
    Save and Mark Discussed
  </button>
</mat-dialog-actions>
