<div>
  <h3 mat-dialog-title>Active jobs in progress</h3>
  <mat-dialog-content>
    <div>
      @for (jobEntry of sidekiqJobs; track jobEntry) {
        <div class="flex items-center justify-between p-1">
          <div>{{ jobEntry.title }}</div>
          <div class="flex items-center">
            <div class="mr-6 text-center">{{ jobEntry.job?.status?.toUpperCase() }}</div>
            <div class="flex gap-2.5">
              <button color="primary" mat-raised-button (click)="viewJob(jobEntry)">View</button>
              <button color="red" mat-raised-button (click)="removeJob(jobEntry)">Clear</button>
            </div>
          </div>
        </div>
      }
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="flex justify-between">
    <button mat-raised-button (click)="dismissModal()">Close</button>
  </mat-dialog-actions>
</div>
