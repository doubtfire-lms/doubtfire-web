<h3 mat-dialog-title>Grant Extension / Special Consideration</h3>
<div mat-dialog-content>
  <p class="w-full">
    Please enter number of days to extend the portfolio due date and all tasks for this student.
  </p>

  <mat-form-field appearance="outline">
    <mat-label>Number of days</mat-label>
    <input matInput min="0" placeholder="Number of days" type="number" [(ngModel)]="days" />
  </mat-form-field>
</div>

<div mat-dialog-actions style="float: right">
  <button color="warn" mat-dialog-close mat-stroked-button>Cancel</button>
  <button
    color="primary"
    mat-button
    mat-dialog-close
    mat-stroked-button
    style="margin-right: 10px"
    (click)="save()"
  >
    Apply
  </button>
</div>
