<div class="flex justify-center">
  <div class="flex w-screen flex-col md:w-2/3">
    <h1>End User License Agreements</h1>
    <p>
      In order to use {{ toolName | async }}, you need to accept the following end user license
      agreement.
    </p>
    <iframe
      #iframe
      style="width: 100%; height: 30em; border: 0"
      (load)="onIframeLoad(iframe)"
    ></iframe>
    <button color="primary" mat-raised-button style="margin-top: 20px" (click)="acceptEula()">
      Accept
    </button>
  </div>
</div>
