worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  server {
    root /usr/share/nginx/html/;
    index index.html;
    listen 80 default_server;
    server_name _;

    set $csp_core "default-src 'self'; base-uri 'self'; object-src 'self' blob:;";
    set $csp_code "script-src 'self' 'sha256-bHnTrDi3viqza8ALPPWMpetYE9cKLKmJZ8UAZvrGeec=' https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;";
    set $csp_content "font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:;";
    set $csp_network "connect-src 'self' blob: https://api.github.com https://www.google-analytics.com https://region1.google-analytics.com; worker-src 'self' blob:;";

    # HTTPS frame ancestors are retained because an external LMS may embed
    # OnTrack through LTI; frame-src remains limited to OnTrack and blob URLs.
    set $csp_frames "child-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self' https:;";
    set $csp_navigation "form-action 'self' https:; manifest-src 'self'; upgrade-insecure-requests";

    # Allow browser features OnTrack uses and explicitly disable unused ones.
    set $permissions_capture "camera=(self), microphone=(self), fullscreen=(self)";
    set $permissions_clipboard "clipboard-read=(self), clipboard-write=(self)";
    set $permissions_disabled "geolocation=(), payment=(), usb=()";

    add_header Content-Security-Policy "$csp_core $csp_code $csp_content $csp_network $csp_frames $csp_navigation" always;
    add_header Permissions-Policy "$permissions_capture, $permissions_clipboard, $permissions_disabled" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    location / {
      try_files $uri $uri/ $uri/index.html /index.html;
    }

    # JPlag is a separate same-origin SPA embedded by OnTrack. Preserve its
    # own history routes on direct navigation instead of serving OnTrack's
    # root index.html as the fallback.
    location /JPlag/ {
      try_files $uri $uri/ /JPlag/index.html;
    }

    # Never expose dotfiles if one is accidentally copied into the image.
    location ~ /\. {
      deny all;
    }
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;
  gzip_proxied any;
  gzip_buffers 32 8k;
}
