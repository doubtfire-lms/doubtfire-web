# PERFORMANCE: Spawn one worker per CPU Nginx detects, allowing requests to be
# processed in parallel instead of bottlenecking on one worker.
worker_processes auto;

events {
  # CAPACITY: Maximum simultaneous connections per worker. 1024 is ample for a
  # static server without reserving excessive connection-tracking memory.
  worker_connections 1024;
}

http {
  # SECURITY: Hide the Nginx version in response headers and generated errors,
  # reducing useful reconnaissance information for attackers.
  server_tokens off;

  # CORRECTNESS: Map file extensions to MIME types so browsers interpret CSS,
  # JavaScript, fonts, images, and manifests correctly.
  include /etc/nginx/mime.types;

  # SECURITY: Treat unknown extensions as binary downloads rather than text or
  # executable content, complementing X-Content-Type-Options below.
  default_type application/octet-stream;

  # PERFORMANCE: Let the kernel transfer static files directly to the socket,
  # avoiding extra copies through Nginx's user-space buffers.
  sendfile on;

  # PERFORMANCE: With sendfile, combine response headers and the start of the
  # file into fewer network packets.
  tcp_nopush on;

  # PERFORMANCE: Reuse idle client connections for 65 seconds, avoiding a new
  # TCP/TLS setup for every asset while still releasing inactive connections.
  keepalive_timeout 65;

  server {
    # SERVING: Directory containing the compiled Angular and JPlag assets.
    root /usr/share/nginx/html/;

    # SERVING: Use index.html when a request resolves to a directory.
    index index.html;

    # ROUTING: Listen on HTTP inside the container and handle unmatched hosts;
    # public TLS is terminated by Caddy before traffic reaches Nginx.
    listen 80 default_server;

    # ROUTING: Conventional catch-all name for the default server, avoiding an
    # accidental dependency on a particular production hostname.
    server_name _;

    # CSP: Default to same-origin resources, prevent hostile <base> changes,
    # and retain blob objects for OnTrack's native PDF previews.
    set $csp_core "default-src 'self'; base-uri 'self'; object-src 'self' blob:;";

    # CSP: Execute only same-origin scripts and block inline event handlers.
    # Inline CSS remains because Angular applies some styles at runtime.
    set $csp_code "script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;";

    # CSP: Permit the fonts, images, and media used by the UI, including local
    # data/blob URLs generated for previews and downloaded files.
    set $csp_content "font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:;";

    # CSP: Restrict fetch/XHR traffic to OnTrack and GitHub's contributor API;
    # blob workers are needed by Monaco, PDF.js, and related tooling.
    set $csp_network "connect-src 'self' blob: https://api.github.com; worker-src 'self' blob:;";

    # CSP: Permit same-origin/blob iframes such as JPlag and PDFs. HTTPS parents
    # remain allowed because an external LMS may embed OnTrack through LTI.
    set $csp_frames "child-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self' https:;";

    # CSP: Restrict form targets and manifests, and automatically upgrade any
    # accidentally referenced HTTP subresources to HTTPS.
    set $csp_navigation "form-action 'self' https:; manifest-src 'self'; upgrade-insecure-requests";

    # PERMISSIONS: Allow capture/fullscreen features OnTrack actually uses for
    # QR scanning, audio feedback, discussions, and full-screen viewers.
    set $permissions_capture "camera=(self), microphone=(self), fullscreen=(self)";

    # PERMISSIONS: Allow same-origin clipboard helpers used to copy/import data.
    set $permissions_clipboard "clipboard-read=(self), clipboard-write=(self)";

    # PERMISSIONS: Explicitly disable powerful APIs that OnTrack does not use.
    set $permissions_disabled "geolocation=(), payment=(), usb=()";

    # SECURITY: Join the readable CSP sections into one enforced response
    # header, including on error responses because of the 'always' flag.
    add_header Content-Security-Policy "$csp_core $csp_code $csp_content $csp_network $csp_frames $csp_navigation" always;

    # SECURITY: Limit browser features available to this origin and its frames.
    add_header Permissions-Policy "$permissions_capture, $permissions_clipboard, $permissions_disabled" always;

    # PRIVACY: Cross-origin requests reveal only the site origin, not sensitive
    # paths or query parameters; same-origin navigation keeps full referrers.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SECURITY: Stop MIME sniffing from turning an uploaded/non-script response
    # into executable JavaScript or CSS.
    add_header X-Content-Type-Options "nosniff" always;

    # SECURITY: Prevent legacy Adobe clients from discovering and applying a
    # permissive cross-domain policy file.
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # SECURITY: Disable the obsolete browser XSS auditor; its response rewriting
    # has historically introduced vulnerabilities and modern CSP replaces it.
    add_header X-XSS-Protection "0" always;

    location / {
      # SPA ROUTING: Serve a real file/directory when present, otherwise return
      # Angular's index so client-side routes work after a direct page load.
      try_files $uri $uri/ $uri/index.html /index.html;
    }

    # JPlag is a separate same-origin SPA embedded by OnTrack. Preserve its
    # own history routes on direct navigation instead of serving OnTrack's
    # root index.html as the fallback.
    location /JPlag/ {
      # SPA ROUTING: Prefer real JPlag assets, then use JPlag's own index for
      # deep routes such as /JPlag/comparison/....
      try_files $uri $uri/ /JPlag/index.html;
    }

    # Never expose dotfiles if one is accidentally copied into the image.
    location ~ /\. {
      # SECURITY: Return 403 for hidden paths such as /.git/config.
      deny all;
    }
  }

  # PERFORMANCE: Compress eligible responses to reduce transferred bytes.
  gzip on;

  # CACHING: Add Vary: Accept-Encoding so caches do not mix compressed and
  # uncompressed representations.
  gzip_vary on;

  # PERFORMANCE: Skip compression below 1 KiB where CPU/header overhead often
  # outweighs the small bandwidth saving.
  gzip_min_length 1024;

  # PERFORMANCE: Compress common text-based assets; binary formats such as PNG,
  # PDF, and ZIP are already compressed and intentionally omitted.
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

  # PERFORMANCE: Permit compression even when Nginx is behind the Caddy proxy.
  gzip_proxied any;

  # PERFORMANCE: Allocate up to 32 reusable 8 KiB buffers while compressing a
  # response, balancing throughput against per-request memory use.
  gzip_buffers 32 8k;
}
