worker_processes 1;

events {  }

http {
    include /etc/nginx/mime.types;

    sendfile on;
    server {
        root /usr/share/nginx/html/;
        index index.html;
        listen 80;

        add_header Content-Security-Policy "default-src https: 'unsafe-inline' 'unsafe-eval' blob: data: ws:; worker-src 'self' blob:; child-src 'self' blob:" always;
        add_header Permissions-Policy "microphone=(self),fullscreen=(self),payment=()" always;

        location / {
          try_files $uri $uri/ $uri/index.html /index.html;
        }
    }

    gzip on;
    gzip_types text/css application/javascript;
    gzip_proxied any;
    gzip_buffers 32 8k;

}
